<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>Boosts · IceFritz</title>
<meta name="description" content="Ongoing and upcoming AQW server and resource boosts, from the Artix calendar.">
<meta name="theme-color" content="#36393f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2336393f'/%3E%3Cpath d='M32 6 42 30 32 58 22 30Z' fill='%2351c5d9'/%3E%3Cpath d='M32 6 42 30H22Z' fill='%23b6f0fb'/%3E%3Cpath d='M32 58 42 30H32Z' fill='%23284e68'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ice.css">
<style>
:root{
  --k-xp:#51c5d9; --k-class:#a99bff; --k-rep:#62d6a8; --k-gold:#e8c45a; --k-all:#d7d8cd; --k-resource:#7fb2cc;
}

.sub time,.sub b{color:var(--frost);font-weight:400}
#clock{white-space:nowrap}

section{margin-bottom:38px}

.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:30px 36px}
.card{position:relative}
.card .group{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card.live .group{color:color-mix(in srgb,var(--k) 70%,var(--frost))}
.dot{width:7px;height:7px;border-radius:50%;background:var(--k)}
.card .row{display:flex;align-items:center;gap:14px;margin-top:14px}
.card .title{font-size:22px;font-weight:600;line-height:1.15;color:#fff}
.card .when{margin-top:4px;color:var(--muted);font-size:14px}
.card .live-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px}
.card .live-row .title{font-size:18px;font-weight:600;line-height:1.2;color:#fff}
.card .live-row .left{margin:0;font-family:"Silkscreen",monospace;font-size:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--k)}
.card .when b{color:var(--frost);font-weight:400}
.card .left{margin-top:14px;font-family:"Silkscreen",monospace;font-size:13px;letter-spacing:.08em;color:var(--k)}
.card.idle .title{color:var(--frost);font-weight:400;font-size:18px}
.card.idle .title b{color:#fff;font-weight:600}
.card.idle .row{opacity:.85}

.badge{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--k) 16%,var(--abyss));border:1px solid color-mix(in srgb,var(--k) 55%,transparent);color:var(--k);font-family:"Silkscreen",monospace;font-size:12px;letter-spacing:.04em}
.badge svg{width:18px;height:auto}
.badge.sm{width:36px;height:36px;border-radius:10px;font-size:10px}
.badge.sm svg{width:14px}
.badge img{width:30px;height:auto}
.badge.sm img{width:24px}

.filters{display:flex;gap:6px;margin:-2px 0 14px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--edge);border-radius:999px;padding:6px 14px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.filters button:hover{color:var(--frost)}
.filters button[aria-pressed="true"]{color:var(--ice-hi);background:color-mix(in srgb,var(--ice) 14%,transparent);border-color:color-mix(in srgb,var(--ice) 70%,transparent)}

.list{list-style:none;padding:0;margin:0;display:grid;gap:30px 44px;align-items:start}
.wk-items{list-style:none;padding:0;margin:0}
.wk-items .item:first-child{border-top:0}
.week{margin:0;font-weight:400;padding:0 0 9px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--edge)}
.item{display:grid;grid-template-columns:52px 1fr auto;align-items:start;gap:14px;padding:10px 0 10px 16px;border-left:2px solid var(--k);border-top:1px solid rgba(81,197,217,.08)}
.date{text-align:center;line-height:1}
.date .dow{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.date .day{display:block;margin-top:4px;font-family:"Silkscreen",monospace;font-size:20px;color:#fff}
.item .what{min-width:0}
.item .what b{display:block;font-weight:600;color:#fff;overflow-wrap:anywhere;line-height:24px}
.item .what span{font-size:13px;color:var(--muted)}
.item .len{font-size:13px;line-height:24px;color:var(--muted);white-space:nowrap}
.empty{padding:12px 0;color:var(--muted)}

.note{color:var(--muted);font-size:13px;line-height:1.55;max-width:60ch}
.note a{color:var(--plate)}
.err{color:#f0a3a3}

@media (min-width:1100px){
  /* Desktop: the sidebar grid is shared in assets/ice.css */
  .side2{margin-top:4px}
  .side .now{grid-template-columns:1fr}
  .list{display:block;columns:2;column-gap:44px}
  .wk{break-inside:avoid;margin-bottom:30px}
}
@media (max-width:520px){
  .item{grid-template-columns:44px 1fr auto;gap:12px;padding-left:14px}
  .item .len{grid-column:auto;margin-top:0}
}
/* Narrow screens: the list comes first in the page order */
@media (max-width:1099px){
  .wrap{display:flex;flex-direction:column}
  .side{display:contents}
  .main{order:1}
}
</style>
</head>
<body class="page">
<svg class="rune bg-rune" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="currentColor">
  <circle cx="100" cy="100" r="96" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="84" stroke-width=".6" stroke-dasharray="2 5"/>
  <circle cx="100" cy="100" r="72" stroke-width="1"/>
  <path d="M100 28 168 128H32Z M100 172 32 72H168Z" stroke-width=".7" opacity=".7"/>
  <path stroke-width="1.4" stroke-linecap="round" d="M100 4v8M100 188v8M4 100h8M188 100h8M32 32l6 6M162 162l6 6M32 168l6-6M162 38l6-6"/>
</svg>

<div class="wrap">
  <aside class="side">
  <header>
    <a class="back" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="chev" d="M11.5 4.5 4 12l7.5 7.5" fill="none" stroke-width="3" stroke-linecap="square"/><rect class="dash" x="10" y="10.3" width="11" height="3.4"/></svg>Go back</a>
    <h1>Server <span class="glow">boosts</span></h1>
    <p class="sub" id="sub">Loading the boost calendar&hellip;</p>
  </header>

  <section aria-labelledby="now-h">
    <h2 id="now-h">Live now</h2>
    <div class="now" id="now"></div>
  </section>
  </aside>

  <main class="main">
  <section aria-labelledby="next-h">
    <h2 id="next-h">Coming up</h2>
    <div class="filters" role="group" aria-label="Show">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="core" aria-pressed="false">Server</button>
      <button type="button" data-f="resource" aria-pressed="false">Resource</button>
    </div>
    <ol class="list" id="list"></ol>
  </section>
  </main>

</div>

<script>
(function () {
  var DAY = 864e5;
  var KINDS = {
    xp:       { label: "Double XP",           glyph: "XP"  },
    "class":  { label: "Double Class Points", glyph: "CP"  },
    rep:      { label: "Double Rep",          glyph: "REP" },
    gold:     { label: "Double Gold",         glyph: "G"   },
    all:      { label: "Double All",          glyph: "ALL" },
    resource: { label: null,                  glyph: null  }
  };
  var ITEM = '<img src="../assets/aqw-item.png" alt="" width="64" height="59">';
  var filter = "all", data = null;

  function d(s) { var p = s.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
  // Everything runs on AQW server time (US Eastern), whatever the visitor's own time zone is.
  var TZ = "America/New_York";
  var SERVER = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23" });
  function server(at) {
    var o = {};
    SERVER.formatToParts(at || new Date()).forEach(function (p) { o[p.type] = +p.value; });
    return o;
  }
  function today() { var n = server(); return new Date(n.year, n.month - 1, n.day); }
  function msToServerMidnight(endDate, t) {
    var n = server();
    return days(t, endDate) * DAY - ((n.hour * 60 + n.minute) * 60 + n.second) * 1000;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function serverClock(at) {
    var n = server(at), dt = new Date(n.year, n.month - 1, n.day);
    return fmt(dt) + ", " + pad(n.hour) + ":" + pad(n.minute);
  }
  function fmt(dt, o) { return dt.toLocaleDateString("en-GB", o || { weekday: "short", day: "numeric", month: "short" }); }
  function days(a, b) { return Math.round((b - a) / DAY); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function title(b) { return KINDS[b.kind].label || b.name.replace(/\s*Boost$/i, ""); }
  function badge(b, sm) {
    var g = KINDS[b.kind].glyph;
    return '<span class="badge' + (sm ? " sm" : "") + '" style="--k:var(--k-' + b.kind + ')">' + (g || ITEM) + "</span>";
  }
  function inWords(n) { return n <= 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days"; }
  function endsWords(end, t) {
    var ms = msToServerMidnight(end, t);
    if (ms <= 0) return "Ending now";
    var h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    if (h < 24) return "Ends in " + h + "h " + pad(m) + "m";
    return "Ends in " + Math.floor(h / 24) + "d " + (h % 24) + "h";
  }

  function card(group, label, t) {
    var mine = data.filter(function (b) { return b.group === group; });
    var live = mine.filter(function (b) { return d(b.start) <= t && t < d(b.end); }).pop();
    var next = mine.filter(function (b) { return d(b.start) > t; })[0];
    if (live) {
      var last = new Date(d(live.end) - DAY);
      return '<article class="card live" style="--k:var(--k-' + live.kind + ')">' +
        '<div class="group"><span class="dot" aria-hidden="true"></span>' + label + "</div>" +
        '<div class="live-row"><span class="title">' + esc(title(live)) + '</span>' +
        '<span class="left">' + endsWords(d(live.end), t) + "</span></div>" +
        '<div class="when">Through <b>' + fmt(last) + "</b></div>" +
        "</article>";
    }
    return '<article class="card idle" style="--k:var(--k-' + (next ? next.kind : "resource") + ')">' +
      '<div class="group">' + label + "</div>" +
      '<div class="row">' + (next ? badge(next) : "") + "<div>" +
      '<div class="title">' + (next ? "Next: <b>" + esc(title(next)) + "</b>" : "Nothing scheduled") + "</div>" +
      (next ? '<div class="when">Starts <b>' + fmt(d(next.start)) + "</b>, " + inWords(days(t, d(next.start))) + "</div>" : "") +
      "</div></div></article>";
  }

  function weekLabel(start, t) {
    var mon = new Date(start); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    var thisMon = new Date(t); thisMon.setDate(thisMon.getDate() - ((thisMon.getDay() + 6) % 7));
    var w = days(thisMon, mon) / 7;
    if (w === 0) return "This week";
    if (w === 1) return "Next week";
    return "Week of " + fmt(mon, { day: "numeric", month: "short" });
  }

  function render() {
    var t = today();
    var clock = document.getElementById("clock");
    if (clock) clock.textContent = serverClock();
    document.getElementById("now").innerHTML = card("core", "Server boost", t) + card("resource", "Resource boost", t);
    var rows = data.filter(function (b) {
      return d(b.start) > t && (filter === "all" || b.group === filter);
    });
    var html = "", lastWeek = "";
    rows.forEach(function (b) {
      var s = d(b.start), e = d(b.end);
      var wk = weekLabel(s, t);
      if (wk !== lastWeek) { html += (lastWeek ? "</ol></li>" : "") + '<li class="wk"><h3 class="week">' + wk + '</h3><ol class="wk-items">'; lastWeek = wk; }
      var len = days(s, e);
      html += '<li class="item" style="--k:var(--k-' + b.kind + ')">' +
        '<span class="date"><span class="dow">' + fmt(s, { weekday: "short" }) + '</span><span class="day">' + s.getDate() + "</span></span>" +
        '<span class="what"><b>' + esc(title(b)) + "</b>" +
        "<span>" + (b.group === "core" ? "Server boost" : "Resource boost") + " · " + fmt(s, { day: "numeric", month: "short" }) + "</span></span>" +
        '<span class="len">' + len + (len === 1 ? " day" : " days") + "</span></li>";
    });
    if (html) html += "</ol></li>";
    document.getElementById("list").innerHTML = html || '<li class="wk"><p class="empty">Nothing on the calendar yet.</p></li>';
  }

  document.querySelectorAll(".filters button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.dataset.f;
      document.querySelectorAll(".filters button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      if (data) render();
    });
  });

  fetch("boosts.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      data = j.boosts.slice().sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
      var up = new Date(j.updated);
      document.getElementById("sub").innerHTML = "Server time <b id='clock'></b>" +
        "<br>Schedule last changed <time datetime='" + j.updated + "'>" + serverClock(up) + " ET</time>";
      render();
      
      // keep the clock, countdowns and server-day rollover live
      setInterval(render, 15000);
    })
    .catch(function () {
      document.getElementById("sub").innerHTML = '<span class="err">Couldn’t load the boost calendar. Try again in a moment.</span>';
    });
})();
</script>
</body>
</html>
