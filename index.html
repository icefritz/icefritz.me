<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>IceFritz · Cruel</title>
<meta name="description" content="IceFritz of the Cruel guild. Break the ice.">
<meta name="theme-color" content="#36393f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2336393f'/%3E%3Cpath d='M32 6 42 30 32 58 22 30Z' fill='%2351c5d9'/%3E%3Cpath d='M32 6 42 30H22Z' fill='%23b6f0fb'/%3E%3Cpath d='M32 58 42 30H32Z' fill='%23284e68'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ice.css">
<link rel="stylesheet" href="assets/crystal.css">
<script src="assets/crystal.js" defer></script>
<style>
html,body{height:100%;overflow:clip}
/* svh = the visible screen on phones/tablets (excludes Safari's toolbars), so the circle centres on what you actually see */
body{height:100svh;display:grid;place-items:center;padding:24px 16px;overflow:hidden}
/* lift the circle so the crystal sits at the optical centre, a little above the middle */
main{translate:0 0}
@media (orientation:portrait){main{translate:0 -11svh}}
/* touch tablets held sideways (iPad landscape): lift a little; desktops stay centred */
@media (orientation:landscape) and (pointer:coarse) and (min-width:900px){main{translate:0 -7svh}}
main{position:relative;max-width:100%;text-align:center;width:min(100%,560px,100svh - 48px);aspect-ratio:1;display:grid;place-content:center;justify-items:center}
/* on phones the circle grows past the text block (up to 120% of the screen width) so the text stays inside the inner ring */
.rune{position:absolute;left:50%;top:50%;width:max(100%,min(560px,120vw));height:auto;aspect-ratio:1;translate:-50% -50%}
.name{font-size:clamp(20px,6vw,38px);position:relative}
.tag{font-size:clamp(17px,5.1vw,25px);margin-top:4px;position:relative}
.crystal-nav{margin:26px 0 18px}
@media (min-width:700px){.crystal-nav .crystal{width:64px}}
.tagline{position:relative;display:grid;justify-items:center;width:max-content;min-width:min(78vw,300px);transition:opacity .25s ease,transform .3s ease}
.menu-open main .tagline{opacity:0;transform:translateY(10px)}
.rune{transition:opacity .3s ease}
.menu-open main .rune{opacity:.12}
h1{margin:0;font-size:inherit;font-weight:inherit;line-height:inherit}
.slogan{position:relative;font-weight:300;font-size:clamp(22px,6.4vw,42px);white-space:nowrap;line-height:1.15;letter-spacing:.02em;color:var(--frost)}
.slogan b{font-weight:600;color:var(--ice-hi)}
/* hint: one line, never wider than the tagline (width:0 + min-width:100% keeps it from widening the box) */
.hint{width:0;min-width:100%;margin-top:8px;font-size:12px;font-weight:400;letter-spacing:.03em;color:#b3bec6;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center}
@media (prefers-reduced-motion:reduce){.tagline{transition:none}.rune{transition:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

</style>
</head>
<body>
<main>
  <svg class="rune" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="currentColor">
    <circle cx="100" cy="100" r="96" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="84" stroke-width=".6" stroke-dasharray="2 5"/>
    <circle cx="100" cy="100" r="72" stroke-width="1"/>
    <path d="M100 28 168 128H32Z M100 172 32 72H168Z" stroke-width=".7" opacity=".7"/>
    <g stroke-width="1.4" stroke-linecap="round">
      <path d="M100 4v8M100 188v8M4 100h8M188 100h8M32 32l6 6M162 162l6 6M32 168l6-6M162 38l6-6"/>
    </g>
  </svg>
  <h1><a class="plate name" href="https://x.com/IceFritz_AE" target="_blank" rel="noopener" title="IceFritz on X">IceFritz<span class="sr-only"> (opens in new tab)</span></a></h1>
  <a class="plate tag" href="https://discord.gg/aqwcruel" target="_blank" rel="noopener" title="Cruel guild Discord">&lsaquo; Cruel &rsaquo;<span class="sr-only"> (opens in new tab)</span></a>
  <div class="crystal-nav" data-crystal-nav></div>
  <div class="tagline">
    <p class="slogan">Break the <b>ice</b></p>
    <p class="hint">(no, really. click the crystal)</p>
  </div>
</main>

</body>
</html>
