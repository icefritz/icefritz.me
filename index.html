<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IceFritz · Coming soon</title>
<meta name="description" content="IceFritz.me is coming soon.">
<meta name="theme-color" content="#0f1521">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231b2537'/%3E%3Crect x='18' y='16' width='28' height='32' fill='none' stroke='%23eef1f6' stroke-width='7'/%3E%3Crect x='28' y='29' width='12' height='6' fill='%23e6a94a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1521;--fg:#eef1f6;--muted:#8a95a8;--accent:#e6a94a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Inter Tight",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
main{text-align:center}
.mark{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:var(--fg);margin-bottom:28px}
.mark i{width:10px;height:10px;background:var(--accent);display:block}
h1{font-weight:700;font-size:clamp(40px,9vw,76px);letter-spacing:-.02em;line-height:1}
p{margin-top:18px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;background:var(--accent);margin-left:10px;vertical-align:1px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <div class="mark"><i></i>IceFritz</div>
  <h1>Coming soon</h1>
  <p>Something new is on the way<span class="dot"></span></p>
</main>
</body>
</html>
